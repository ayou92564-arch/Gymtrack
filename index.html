<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0c"><title>GymTrack Pro</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07090b;color:#f5f7f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}

@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr}.wrap{padding-inline:12px}}
</style></head><body>
<header class="top"><div class="logo">GYM<span>TRACK</span> <b>PRO</b></div><button class="btn dark" onclick="clearAll()">مسح البيانات</button></header>
<main class="wrap"><section class="hero"><div class="eyebrow">سجل • تابع • تطور</div><h1>تمرينك، أوزانك، وتقدمك في مكان واحد.</h1><div class="sub">سجّل كل مجموعة، تابع أفضل أوزانك، واحفظ تاريخ تمارينك على جهازك.</div></section>
<section class="stats"><div class="stat"><strong id="workouts">0</strong><span>جلسات محفوظة</span></div><div class="stat"><strong id="sets">0</strong><span>مجموع المجموعات</span></div><div class="stat"><strong id="volume">0</strong><span>إجمالي الكيلو</span></div><div class="stat"><strong id="records">0</strong><span>تمارين مسجلة</span></div></section>
<div class="tabs"><button class="tab active" data-view="exercises">التمارين</button><button class="tab" data-view="history">السجل</button><button class="tab" data-view="timer">المؤقت</button></div>
<section id="exercisesView"><div class="controls"><input id="search" placeholder="🔎 ابحث عن تمرين..."><select id="muscle"><option value="all">كل العضلات</option></select></div><div id="grid" class="grid"></div></section>
<section id="historyView" style="display:none"><div class="panel"><h2>📈 سجل التقدم</h2><div id="history"></div></div></section>
<section id="timerView" style="display:none"><div class="panel" style="text-align:center"><h2>⏱️ مؤقت الراحة</h2><div id="timer" class="timer">01:30</div><div class="row" style="justify-content:center"><button class="btn primary" onclick="startTimer()">ابدأ</button><button class="btn dark" onclick="pauseTimer()">إيقاف</button><button class="btn dark" onclick="resetTimer()">إعادة</button></div><p class="muted">مدة الراحة بالثواني:</p><input id="timerInput" type="number" min="10" max="600" value="90" style="max-width:180px;text-align:center"></div></section>
</main><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><button class="close" onclick="closeModal()">إغلاق</button><div id="modalContent"></div></div></div>

/photo-1549060279-7e168fcee0c2?auto=format&fit=crop&w=900&q=80"}, {"muscle": "بطن", "name": "روشن روسيان تويست", "img": "https://images.unsplash.com/photo-1549060279-7e168fcee0c2?auto=format&fit=crop&w=900&q=80"}, {"muscle": "كارديو", "name": "جري على السير", "img": "https://images.unsplash.com/photo-1538805060514-97d9cc17730c?auto=format&fit=crop&w=900&q=80"}, {"muscle": "كارديو", "name": "مشي على السير", "img": "https://images.unsplash.com/photo-1538805060514-97d9cc17730c?auto=format&fit=crop&w=900&q=80"}, {"muscle": "كارديو", "name": "دراجة ثابتة", "img": "https://images.unsplash.com/photo-1594737625785-a6cbdabd333c?auto=format&fit=crop&w=900&q=80"}, {"muscle": "كارديو", "name": "إليبتيكال", "img": "https://images.unsplash.com/photo-1538805060514-97d9cc17730c?auto=format&fit=crop&w=900&q=80"}, {"muscle": "كامل الجسم", "name": "بيربي", "img": "https://images.unsplash.com/photo-1517838277536-f5f99be501a1?auto=format&fit=crop&w=900&q=80"}, {"muscle": "كامل الجسم", "name": "فارمرز كاري", "img": "https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?auto=format&fit=crop&w=900&q=80"}, {"muscle": "كامل الجسم", "name": "كيتل بيل سوينغ", "img": "https://images.unsplash.com/photo-1517963879433-6ad2b056d3c3?auto=format&fit=crop&w=900&q=80"}, {"muscle": "كامل الجسم", "name": "ضغط", "img": "https://images.unsplash.com/photo-1598971639058-fab3c3109a00?auto=format&fit=crop&w=900&q=80"}];const key="gymtrack_pro_v1";let db=JSON.parse(localStorage.getItem(key)||'{"history":[]}'),timerSec=90,timerInt=null;
const $=id=>document.getElementById(id);const cats=[...new Set(exercises.map(x=>x.muscle))];cats.forEach(c=>{let o=document.createElement("option");o.value=c;o.textContent=c;$("muscle").appendChild(o)});
function save(){localStorage.setItem(key,JSON.stringify(db));updateStats();renderHistory()}function updateStats(){let h=db.history;$("workouts").textContent=new Set(h.map(x=>x.date)).size;$("sets").textContent=h.length;$("volume").textContent=Math.round(h.reduce((a,x)=>a+(+x.weight||0)*(+x.reps||0),0)).toLocaleString("ar-SA");$("records").textContent=new Set(h.map(x=>x.name)).size}
function esc(v){return v.replaceAll("'","\\\\'")}function render(){let q=$("search").value.trim().toLowerCase(),cat=$("muscle").value;let list=exercises.filter(x=>(cat==="all"||x.muscle===cat)&&(!q||x.name.toLowerCase().includes(q)||x.muscle.toLowerCase().includes(q)));$("grid").innerHTML=list.map(x=>`<article class="card"><div class="photo" style="background-image:url('${x.img}')"><div class="shade"></div><div class="ct">${x.name}</div></div><div class="body"><span class="tag">${x.muscle}</span><div class="row"><button class="btn primary" onclick="openExercise('${esc(x.name)}')">تسجيل التمرين</button><button class="btn dark" onclick="info('${esc(x.name)}')">ℹ️ شرح</button></div></div></article>`).join("")||'<div class="empty">لا توجد تمارين مطابقة.</div>'}
function setRow(n){return `<div class="setrow"><div class="setnum">${n}</div><input class="weight" type="number" min="0" step="0.5" placeholder="الوزن"><input class="reps" type="number" min="0" placeholder="التكرارات"><button class="btn dark" onclick="this.parentElement.remove()">×</button></div>`}
function openExercise(name){let x=exercises.find(e=>e.name===name);$("modalContent").innerHTML=`<h2>${x.name}</h2><p class="muted">${x.muscle}</p><div class="sets" id="setBox">${[1,2,3].map(setRow).join("")}</div><div class="row" style="margin-top:12px"><button class="btn dark" onclick="addSet()">+ مجموعة</button><button class="btn primary" onclick="saveExercise('${esc(name)}')">💾 حفظ التمرين</button></div>`;$("modal").classList.add("show")}
function addSet(){$("setBox").insertAdjacentHTML("beforeend",setRow($("setBox").children.length+1))}
function saveExercise(name){let rows=[...$("setBox").querySelectorAll(".setrow")],now=new Date(),muscle=exercises.find(x=>x.name===name).muscle;rows.forEach(r=>{let w=r.querySelector(".weight").value,rep=r.querySelector(".reps").value;if(w!==""||rep!=="")db.history.push({name,muscle,weight:+w||0,reps:+rep||0,date:now.toLocaleDateString("ar-SA"),display:now.toLocaleString("ar-SA")})});save();closeModal();alert("تم الحفظ ✅")}
function info(name){let x=exercises.find(e=>e.name===name);$("modalContent").innerHTML=`<h2>${x.name}</h2><p><b>العضلة:</b> ${x.muscle}</p><p class="muted">نفّذ الحركة بتحكم كامل، واختر وزنًا مناسبًا لمستواك. يمكنك مشاهدة شروحات إضافية.</p><a class="btn primary" style="display:inline-block;text-decoration:none" target="_blank" href="https://www.youtube.com/results?search_query=${encodeURIComponent(x.name+" exercise form")}">▶️ فيديو شرح</a>`;$("modal").classList.add("show")}
function closeModal(){$("modal").classList.remove("show")}function renderHistory(){if(!db.history.length){$("history").innerHTML='<div class="empty">لا يوجد سجل حتى الآن.</div>';return}$("history").innerHTML=[...db.history].reverse().map(x=>`<div class="history-item"><div><b>${x.name}</b><div class="muted">${x.display}</div></div><div>${x.weight} كجم × ${x.reps}</div></div>`).join("")}
function clearAll(){if(confirm("حذف كل سجل التمارين؟")){db={history:[]};save()}}function show(v){["exercises","history","timer"].forEach(x=>$(x+"View").style.display=x===v?"block":"none");document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.view===v));if(v==="history")renderHistory()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>show(b.dataset.view));$("search").oninput=render;$("muscle").onchange=render;
function drawTimer(){$("timer").textContent=String(Math.floor(timerSec/60)).padStart(2,"0")+":"+String(timerSec%60).padStart(2,"0")}function startTimer(){if(timerInt)return;if(timerSec<=0)timerSec=Math.max(10,+$("timerInput").value||90);timerInt=setInterval(()=>{timerSec--;drawTimer();if(timerSec<=0){clearInterval(timerInt);timerInt=null;navigator.vibrate?.([200,100,200]);alert("انتهت الراحة 🔥")}},1000)}function pauseTimer(){clearInterval(timerInt);timerInt=null}function resetTimer(){pauseTimer();timerSec=Math.max(10,+$("timerInput").value||90);drawTimer()}
updateStats();render();renderHistory();drawTimer();
</script></body></html>
